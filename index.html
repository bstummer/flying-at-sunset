  prevVP = curVP;
  histValid = 1;

  // --- bird
  tBegin('bird');
  const birdBox = renderBird(time, curVP, birdRel);
  tEnd();

  // --- bloom
  tBegin('post');
  let src = T.scene, sw = w, sh = h;
  for (let i = 0; i < bloomLevels.length; i++) {
    const L = bloomLevels[i];
    pass(P.down, L.fb, L.w, L.h, { uSrc: src, uBird: T.birdTex, uBirdBox: birdBox, uSrcTexel: [1 / sw, 1 / sh], uFirst: { i: i === 0 ? 1 : 0 }, uClampHi: BLOOM_CLAMP });
    src = L.tex; sw = L.w; sh = L.h;
  }
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  for (let i = bloomLevels.length - 1; i > 0; i--) {
    const S = bloomLevels[i], D = bloomLevels[i - 1];
    pass(P.up, D.fb, D.w, D.h, { uSrc: S.tex, uSrcTexel: [1 / S.w, 1 / S.h], uDstTexel: [1 / D.w, 1 / D.h], uWeight: BLOOM_UP_W });
  }
  gl.disable(gl.BLEND);

  // --- sun rays
  const sunView = [dot(SUN_DIR, cam.right), dot(SUN_DIR, cam.up), dot(SUN_DIR, cam.fwd)];
  let rayStrength = 0;
  let sunUv = [0.5, 0.5];
  if (sunView[2] > 0.05) {
    sunUv = [0.5 + 0.5 * sunView[0] / sunView[2] / tanX, 0.5 + 0.5 * sunView[1] / sunView[2] / tanY];
    const off = Math.max(Math.abs(sunUv[0] - 0.5), Math.abs(sunUv[1] - 0.5));
    rayStrength = 1 - smoothstep(0.6, 1.3, off);
  }
  if (rayStrength > 0.001) {
    pass(P.raymask, FB.rayA, R.rayW, R.rayH, { uHist: histTex, uBird: T.birdTex, uBirdBox: birdBox, uCamRight: cam.right, uCamUp: cam.up, uCamFwd: cam.fwd, uTanHalf: [tanX, tanY], uSunDir: SUN_DIR, uDstTexel: [1 / R.rayW, 1 / R.rayH] });
    pass(P.rayblur, FB.rayB, R.rayW, R.rayH, { uSrc: T.rayA, uSunUv: sunUv, uDstTexel: [1 / R.rayW, 1 / R.rayH], uStepScale: 1 / 24 / 24 * 0.95, uDecay: 1.0 });
    pass(P.rayblur, FB.rayA, R.rayW, R.rayH, { uSrc: T.rayB, uSunUv: sunUv, uDstTexel: [1 / R.rayW, 1 / R.rayH], uStepScale: 1 / 24 * 0.95, uDecay: 0.93 });
  } else {
    gl.bindFramebuffer(gl.FRAMEBUFFER, FB.rayA);
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  }

  // --- final
  const sunC = sunColorAt(cam.pos[1]);
  pass(P.final, null, w, h, {
    uScene: T.scene, uBird: T.birdTex, uBloom: bloomLevels[0].tex, uRays: T.rayA, uBirdBox: birdBox,
    uExposure: exposure, uBloomMix: BLOOM_MIX, uBloomScale: BLOOM_MIX / BLOOM_NORM, uRayCol: scl(sunC, RAYS_K * rayStrength), uTime: time % 1000, uRes: [w, h], uView: { i: VIEW }, uTM: { i: TONEMAP }, uContrast: CONTRAST, uDbg: histTex, uDbg2: T.cloudDepth, uDbgScale: [R.lowW / R.lowMaxW, R.lowH / R.lowMaxH],
  });
  tEnd();
  frame++;
}

let exposure = Q.has('exp') ? parseFloat(Q.get('exp')) : 14.0;
const RAYS_K = Q.has('rays') ? parseFloat(Q.get('rays')) : 0.18;
const BLOOM_UP_W = Q.has('bloomw') ? parseFloat(Q.get('bloomw')) : 0.6;                                         // weight of each coarser bloom level
const BLOOM_NORM = (1 - Math.pow(BLOOM_UP_W, 7)) / (1 - BLOOM_UP_W); // total weight of the 7-level chain
const BLOOM_MIX = Q.has('bloom') ? parseFloat(Q.get('bloom')) : 0.09;
const BLOOM_CLAMP = Q.has('bclamp') ? parseFloat(Q.get('bclamp')) : 3000;

function renderBird(time, VP, birdRel) {
  const b = bird_;
  // model matrix (camera relative): columns right, up, back(-fwd), translation
  const back = scl(b.fwd, -1);
  const M = new Float32Array([b.right[0], b.right[1], b.right[2], 0, b.up[0], b.up[1], b.up[2], 0, back[0], back[1], back[2], 0, birdRel[0], birdRel[1], birdRel[2], 1]);
  // wing flex: dihedral rises with load, a slow breathing and a fine flutter at speed
  const sp = sat((b.speed - FLIGHT.vCruise) / (FLIGHT.vMax - FLIGHT.vCruise));
  const bend = 0.07 + 0.09 * clamp(b.load - 1, -0.5, 1.5) + 0.025 * Math.sin(time * 1.4) + 0.012 * Math.sin(time * 2.3 + 1.0);
  const flutter = (0.006 + 0.016 * sp) * Math.sin(time * 31.0) + 0.004 * Math.sin(time * 47.0);
  const twist = -0.05 - 0.04 * sp;
  const flex = [bend, twist, flutter, 0];
  // shadow map from the sun
  const sF = scl(SUN_DIR, -1);                 // shadow camera looks from the sun toward the bird
  const sR = norm(cross(sF, [0, 1, 0]));
  const sU = cross(sR, sF);
  const eye = add(birdRel, scl(SUN_DIR, 3));
  const SV = viewFromBasis(sR, sU, sF, eye);
  const SP = ortho(-0.62, 0.62, -0.62, 0.62, 0.5, 6);
  const shadowVP = mat4Mul(SP, SV);
  gl.bindFramebuffer(gl.FRAMEBUFFER, FB.shadow);
  gl.viewport(0, 0, SHADOW_N, SHADOW_N);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.POLYGON_OFFSET_FILL);
  gl.polygonOffset(1.5, 2.0);
  gl.useProgram(P.shadow.p);
  setUniforms(P.shadow, { uModel: M, uViewProj: shadowVP, uShadowVP: shadowVP, uFlex: flex });
  gl.bindVertexArray(bird.vao);
  gl.drawArrays(gl.TRIANGLES, 0, bird.count);
  gl.disable(gl.POLYGON_OFFSET_FILL);
  // screen bounding box of the bird (generous sphere projection)
  const c = [dot(birdRel, cam.right), dot(birdRel, cam.up), dot(birdRel, cam.fwd)];
  let box = [0, 0, 0, 0];
  if (c[2] > 0.2) {
    const tanY = Math.tan(cam.fov / 2), tanX = tanY * R.w / R.h;
    const rad = 0.75;
    const cx = 0.5 + 0.5 * c[0] / c[2] / tanX, cy = 0.5 + 0.5 * c[1] / c[2] / tanY;
    const ex = 0.5 * rad / Math.max(c[2] - rad, 0.05) / tanX, ey = 0.5 * rad / Math.max(c[2] - rad, 0.05) / tanY;
    box = [clamp(cx - ex, 0, 1), clamp(cy - ey, 0, 1), clamp(cx + ex, 0, 1), clamp(cy + ey, 0, 1)];
  }
  const px = [Math.floor(box[0] * R.w), Math.floor(box[1] * R.h), Math.ceil(box[2] * R.w), Math.ceil(box[3] * R.h)];
  if (px[2] - px[0] < 1 || px[3] - px[1] < 1) { gl.disable(gl.DEPTH_TEST); return [2, 2, -1, -1]; }
  gl.bindFramebuffer(gl.FRAMEBUFFER, FB.birdMS);
  gl.viewport(0, 0, R.w, R.h);
  gl.enable(gl.SCISSOR_TEST);
  gl.scissor(px[0], px[1], px[2] - px[0], px[3] - px[1]);
  gl.clearColor(0, 0, 0, 0);
  gl.clearDepth(1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.useProgram(P.bird.p);
  setUniforms(P.bird, { uModel: M, uViewProj: VP, uShadowVP: shadowVP, uFlex: flex, uProbe: T.probe, uShadowMap: T.shadow, uSunDir: SUN_DIR, uShadowTexel: 1 / SHADOW_N });
  gl.bindVertexArray(bird.vao);
  gl.drawArrays(gl.TRIANGLES, 0, bird.count);
  gl.disable(gl.DEPTH_TEST);
  // resolve
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, FB.birdMS);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, FB.birdResolve);
  gl.blitFramebuffer(px[0], px[1], px[2], px[3], px[0], px[1], px[2], px[3], gl.COLOR_BUFFER_BIT, gl.NEAREST);
  gl.disable(gl.SCISSOR_TEST);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
  gl.bindVertexArray(null);
  // shrink by half a pixel to avoid sampling stale texels outside the scissor
  return [(px[0] + 0.5) / R.w, (px[1] + 0.5) / R.h, (px[2] - 0.5) / R.w, (px[3] - 0.5) / R.h];
}

function readProbeAsync() {
  if (!extCBF) return;
  if (probeSync) {
    const st = gl.getSyncParameter(probeSync, gl.SYNC_STATUS);
    if (st !== gl.SIGNALED) return;
    gl.deleteSync(probeSync); probeSync = null;
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, probePBO);
    gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, probeBuf);
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    probeData = [probeBuf[12], probeBuf[13], probeBuf[14], probeBuf[15], probeBuf[20]];
  }
  if (!probePBO) { probePBO = gl.createBuffer(); gl.bindBuffer(gl.PIXEL_PACK_BUFFER, probePBO); gl.bufferData(gl.PIXEL_PACK_BUFFER, 8 * 16, gl.STREAM_READ); }
  gl.bindFramebuffer(gl.FRAMEBUFFER, FB.probe);
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, probePBO);
  gl.readPixels(0, 0, 8, 1, gl.RGBA, gl.FLOAT, 0);
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
  probeSync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
}

// =====================================================================================
//                                   HINT & MAIN LOOP
// =====================================================================================
const isTouch = matchMedia('(pointer: coarse)').matches;   // primary pointer is a finger
hintEl.innerHTML = isTouch ? 'Touch and drag to steer<small>dive to gather speed · climb to soar</small>'
  : 'Move the mouse to steer<small>dive to gather speed · climb to soar · arrow keys work too</small>';
let hintShown = false, hintHidden = false;

let last = -1, clock = 0, fpsAcc = 0, fpsN = 0;
const statsEl = DEBUG && !TEST ? document.createElement('div') : null;
if (statsEl) { statsEl.id = 'stats'; document.body.appendChild(statsEl); }
const FIXED_DT = TEST ? parseFloat(Q.get('dt') || '0.0166') : 0;
const TEST_FRAMES = parseInt(Q.get('frames') || '24', 10);
const FREEZE = Q.has('freeze');
const CLOSEUP = Q.has('closeup') ? Q.get('closeup').split(',').map(Number) : null;

// dynamic resolution: keep the frame inside budget by scaling the cloud trace resolution.
// With GPU timers we solve for the trace budget directly; otherwise we watch frame times.
const DR = { acc: [], cool: 0, ceiling: 0.75, gpuN: 0, slow: 0, warm: 0 };
const GPU_BUDGET = 12.5; // ms: leaves headroom for the browser at 60 Hz
function adaptResolution(dtMs) {
  if (TEST) { if (gpuTimer && !CPUPROF) { gpuTimer.poll(); window.__gpu = gpuTimer.ms; } return; }
  if (++DR.warm < 8) { if (gpuTimer) gpuTimer.poll(); return; }    // shader warm-up frames
  if (gpuTimer) {
    gpuTimer.poll();
    if (++DR.gpuN < 10) return;
    DR.gpuN = 0;
    const tot = gpuTimer.total(), tr = gpuTimer.ms.trace || 0;
    if (!tot || !tr) return;
    const fixed = Math.max(tot - tr, 0);
    const budget = Math.max(GPU_BUDGET - fixed, 1.5);
    let k = Math.sqrt(budget / tr);
    k = tot > GPU_BUDGET ? clamp(k, 0.8, 0.98) : clamp(k, 1.0, 1.05);
    if (Math.abs(k - 1) > 0.015) R.scale = clamp(R.scale * k, 0.22, 0.75);
    // even the cheapest clouds don't fit: render fewer full-resolution pixels
    if (R.scale <= 0.23 && tot > GPU_BUDGET * 1.3) { if (++DR.slow > 6) downgradePixels(); } else DR.slow = 0;
    return;
  }
  if (dtMs > 250) return;                     // tab switch, hitch
  DR.acc.push(dtMs);
  // far over budget (weak GPU): react within a few frames instead of waiting for a full window
  if (DR.acc.length >= 4 && DR.acc.slice(-4).every(v => v > 45) && R.scale > 0.23) {
    R.scale = Math.max(0.22, R.scale * 0.72); DR.ceiling = Math.max(0.24, R.scale * 1.1); DR.acc.length = 0; return;
  }
  if (DR.acc.length < 24) return;
  const sorted = DR.acc.slice().sort((a, b) => a - b);
  const med = sorted[sorted.length >> 1];
  DR.acc.length = 0;
  if (DR.cool > 0) { DR.cool--; return; }
  if (med > 18.5) {                           // dropping below ~55 fps
    R.scale = Math.max(0.22, R.scale * (med > 26 ? 0.84 : 0.92));
    DR.ceiling = Math.max(0.24, R.scale * 1.04);
    DR.cool = 2;
    if (R.scale <= 0.23 && med > 24) { if (++DR.slow > 4) downgradePixels(); } else DR.slow = 0;
  } else if (med < 12.0 || (med < 17.4 && R.scale < DR.ceiling)) {
    R.scale = Math.min(DR.ceiling, R.scale * 1.035);
    DR.cool = 3;
  }
}
function downgradePixels() {
  DR.slow = 0;
  if (maxPixels <= 0.55e6) return;
  maxPixels = Math.max(0.55e6, maxPixels * 0.7);
  R.scale = 0.32;
}

let startWall = -1;
function loop(now) {
  if (window.__done) return;
  if (startWall < 0) startWall = now;
  requestAnimationFrame(loop);
  const t = now * 0.001;
  let dt = last < 0 ? 1 / 60 : Math.min(t - last, 0.1);
  const dtMs = (t - last) * 1000;
  last = t;
  if (TEST) dt = FIXED_DT;
  clock += dt;
  resize();
  updateInput(dt);
  if (!FREEZE) updateFlight(dt, clock);
  else updateFlight(0, clock);
  updateCamera(dt, frame === 0);
  inCloud = damp(inCloud, probeData ? sat(probeData[0] / 0.012) : 0, 3.0, dt);
  render(clock, dt);
  if (frame === 2) canvas.classList.add('on');
  // hint (wall-clock timing so it behaves the same at any frame rate)
  if (!TEST) {
    const wall = (now - startWall) * 0.001;
    if (!hintShown && wall > 1.8) { hintEl.classList.add('on'); hintShown = true; }
    if (hintShown && !hintHidden && (wall > 10 || input.activeTime > 3.2)) { hintEl.classList.remove('on'); hintHidden = true; }
  }
  if (frame > 3) adaptResolution(dtMs);
  fpsAcc += dtMs; fpsN++;
  if (fpsN >= 30) {
    stats.fps = 1000 / (fpsAcc / fpsN); fpsAcc = 0; fpsN = 0;
    if (statsEl) {
      const g = gpuTimer ? Object.entries(gpuTimer.ms).map(([k, v]) => `${k} ${v.toFixed(2)}`).join('  ') + `  = ${gpuTimer.total().toFixed(2)} ms` : 'no gpu timer';
      statsEl.textContent = `${stats.fps.toFixed(1)} fps  ${R.w}x${R.h}  clouds ${R.lowW}x${R.lowH} (${R.scale.toFixed(2)})\n${g}\nalt ${bird_.pos[1].toFixed(0)} m  speed ${bird_.speed.toFixed(0)} m/s  sea ${seaTopAt(bird_.pos[0], bird_.pos[2]).toFixed(0)}`;
    }
  }
  window.__frame = frame;
  if (TEST && Q.has('log')) {
    (window.__log = window.__log || []).push([+clock.toFixed(3), +bird_.pos[0].toFixed(1), +bird_.pos[1].toFixed(1), +bird_.pos[2].toFixed(1),
      +bird_.speed.toFixed(2), +(bird_.bank / DEG).toFixed(1), +(bird_.gamma / DEG).toFixed(2), +(bird_.yaw / DEG).toFixed(1),
      +seaTopAt(bird_.pos[0], bird_.pos[2]).toFixed(0), probeData ? +probeData[2].toFixed(0) : null, +(cam.roll / DEG).toFixed(1), +(cam.fov / DEG).toFixed(1)]);
  }
  if (TEST && frame >= TEST_FRAMES) { gl.finish(); window.__done = true; }
}

// GPU reset (driver update, sleep, too many contexts): rebuild everything by reloading
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); window.__done = true; });
canvas.addEventListener('webglcontextrestored', () => location.reload());
// quiet extras: double-click or F toggles fullscreen
function toggleFullscreen() {
  const d = document;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else { const el = d.documentElement; const req = el.requestFullscreen || el.webkitRequestFullscreen; if (req) { const pr = req.call(el); if (pr && pr.catch) pr.catch(() => {}); } }
}
canvas.addEventListener('dblclick', toggleFullscreen);
window.addEventListener('keydown', e => { if (e.code === 'KeyF' && !e.repeat) toggleFullscreen(); });
document.addEventListener('visibilitychange', () => { last = -1; });
// Boot: let the driver compile all shaders in parallel without blocking the page, then
// generate the static data and start flying.
function programsReady() {
  if (!extParallel) return true;
  for (const p of programs) if (!gl.getProgramParameter(p.p, extParallel.COMPLETION_STATUS_KHR)) return false;
  return true;
}
function boot() {
  if (!programsReady()) { requestAnimationFrame(boot); return; }
  try { checkPrograms(); } catch (e) { fail('Shader error — ' + e.message); return; }
  generateStatic();
  requestAnimationFrame(loop);
}
boot();
window.__debug = {
  bird: bird_, cam, R, towers, seaTopAt,
  probe: () => {
    const b = new Float32Array(32);
    gl.bindFramebuffer(gl.FRAMEBUFFER, FB.probe);
    gl.readPixels(0, 0, 8, 1, gl.RGBA, gl.FLOAT, b);
    const amb = new Float32Array(8);
    gl.bindFramebuffer(gl.FRAMEBUFFER, FB.amb);
    gl.readPixels(0, 0, 2, 1, gl.RGBA, gl.FLOAT, amb);
    return { sun: Array.from(b.slice(0, 4)), ambUp: Array.from(b.slice(4, 7)), ambDn: Array.from(b.slice(8, 11)), misc: Array.from(b.slice(12, 16)), mist: Array.from(b.slice(16, 19)), ambTex: Array.from(amb) };
  },
};
})();
</script>
</body>
</html>
